name: fyphub-p1

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    container_name: fyphub-p1-db
    environment:
      POSTGRES_DB: fyphub_p1
      POSTGRES_USER: fyphub_p1_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
    ports:
      - "127.0.0.1:55732:5432"
    volumes:
      - fyphub-p1-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fyphub-p1-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyphub_p1_user -d fyphub_p1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fyphub-p1-postgres-data:
    name: fyphub-p1-postgres-data

networks:
  fyphub-p1-network:
    name: fyphub-p1-network
